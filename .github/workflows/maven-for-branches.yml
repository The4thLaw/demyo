name: Java build (for branches)

on:
  push:
    branches: [ master ]

jobs:
  # JDK17 build with Sonar
  build17:
    name: Build on JDK 17
    
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Shallow clones are disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          distribution: temurin
      - name: Configure Maven for GitHub packages
        uses: s4u/maven-settings-action@v4.0.0
        with:
          repositories: |
            [{
                "id": "github-the4thlaw-commons",
                "url": "https://maven.pkg.github.com/The4thLaw/java-commons",
                "snapshots": {
                  "enabled": "true"
                }
            }]
          servers: |
            [{
                "id": "github-the4thlaw",
                "username": "The4thLaw",
                "password": "${{ secrets.GITHUB_TOKEN }}",
                "repositoryOrigins": {
                  "repositoryOrigin": "https://maven.pkg.github.com/"
                }
            }]
      - name: Cache SonarQube packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=The4thLaw_demyo -DCI=true -Pvue,coverage,dev
        working-directory: ./source
